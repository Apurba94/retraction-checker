[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "retraction-checker"
version = "0.1.0"
description = "Screen a bibliography's DOIs against a Retraction Watch/Crossref retraction dataset."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JANIN A APURBA", email = "japurba97@gmail.com"}]
keywords = ["research", "automation", "reproducibility", "academic"]
dependencies = []

[project.scripts]
retraction-checker = "retraction_checker.cli:main"

[tool.setuptools]
packages = ["retraction_checker"]
